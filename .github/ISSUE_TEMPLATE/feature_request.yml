name: ✨ 功能建议
description: 提出新功能、新平台适配或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提需求。请重点说清**要解决的问题**，而不是只描述方案——方案可以一起商量。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我理解本项目刻意只做到「进草稿箱 + 人工发布」（不碰自动群发红线）
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在的工作流哪里卡住了？
      placeholder: 例如：每次都要手动把封面图压到 2MB 以下，能不能自动压缩
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 有想法就写，没有也没关系

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在怎么绕过这个问题的？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 单个命令的小改进
        - 新命令 / 新能力
        - 新平台适配（如其他智能体）
        - 文档 / 示例
        - 不确定
    validations:
      required: true
