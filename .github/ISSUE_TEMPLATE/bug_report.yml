name: 🐛 Bug 报告
description: 报告排版、草稿箱、视频/配图等功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了快速定位，请尽量填全下面的信息。
        **⚠️ 不要贴真实的 AppID / AppSecret / access_token / media_id**，打码为 `wx***` 即可。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我已读过 docs/pitfalls.md，确认不是已知坑
          required: true

  - type: dropdown
    id: module
    attributes:
      label: 出问题的模块
      options:
        - 草稿箱 publish（新建）
        - 草稿箱 update（更新）
        - draft-get / draft-list（拉取与自检）
        - 自动封面生成
        - 视频嵌入（--video）
        - SVG 交互卡
        - 配图修复（fix_content_images）
        - 凭证 / 权限 / 环境安装
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么？和预期差在哪？
      placeholder: 例如：publish 成功返回 media_id，但后台草稿箱看不到这篇文章
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 能稳定复现的命令或步骤，去掉凭证后的完整命令
      placeholder: |
        1. python scripts/wx_publish.py publish a.html --title "测试"
        2. 打开公众号后台 → 草稿箱
        3. 看到 ...
      render: bash
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: 报错输出 / 日志
      description: 完整贴出命令输出（含 errcode / errmsg 最关键）。凭证请打码。
      render: shell

  - type: input
    id: version
    attributes:
      label: 使用的版本
      description: Release 版本号或 commit hash（`git log --oneline -1`）
      placeholder: v1.0.0 或 958b509
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统 + Python 版本 + 公众号类型（订阅号/服务号、是否认证）
      placeholder: Windows 11 / Python 3.12 / 未认证订阅号
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、HTML 片段、draft-get --check 的自检结果等
