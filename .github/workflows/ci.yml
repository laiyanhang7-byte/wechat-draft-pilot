name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash   # 三平台统一 bash（Windows runner 默认 pwsh，bash 语法的扫描步骤会炸）

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile scripts/wx_publish.py scripts/svg_cards.py scripts/fix_content_images.py

      - name: CLI smoke (--help)
        run: python -X utf8 scripts/wx_publish.py --help

      - name: Video iframe unit tests
        run: python -X utf8 tests/test_video_iframe.py

      - name: Core unit tests (garble / svg / ahash)
        run: python -X utf8 tests/test_core.py

      - name: Secret leak scan
        run: |
          # 扫描硬编码密钥形态：32 位十六进制串被直接赋值给 secret 类变量、或明文 AppID 赋值
          if grep -rnE "(secret|SECRET)[\"']?\s*[:=]\s*[\"'][0-9a-f]{32}[\"']" scripts/ *.json 2>/dev/null; then
            echo "::error::发现疑似硬编码 AppSecret"; exit 1
          fi
          if grep -rnE "APPID\s*=\s*[\"']wx[0-9a-f]{16}[\"']" scripts/ 2>/dev/null; then
            echo "::error::发现疑似硬编码 AppID"; exit 1
          fi
          if grep -rnE "[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}" docs/ scripts/ 2>/dev/null | grep -vE "127\.0\.0\.1|0\.0\.0\.0|255\.|示例|example"; then
            echo "::error::发现疑似真实 IP 地址"; exit 1
          fi
          echo "密钥泄漏扫描通过"
